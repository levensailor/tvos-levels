[project]
name = "band-levels-bridge"
version = "0.1.0"
description = "Local audio-level bridge that feeds per-track gain, VU, dBFS, and LUFS to the Band Levels tvOS dashboard."
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "levensailor" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "sounddevice>=0.4.7",
    "mcp>=1.2",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["BandLevels"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
